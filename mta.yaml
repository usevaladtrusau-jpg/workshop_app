_schema-version: 3.3.0
ID: workshop_app
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: workshop_app-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: workshop_app-auth
      - name: workshop_app-db

  - name: workshop_app-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: workshop_app-db
  - name: workshop_app
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: workshop_app-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: workshop_app-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: workshop_app-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Passenger (workshop_app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Passenger'
          - name: 'BookingAgent (workshop_app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.BookingAgent'
          - name: 'FlightOperator (workshop_app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.FlightOperator'
          - name: 'FinanceManager (workshop_app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.FinanceManager'
          - name: 'BusinessAdministrator (workshop_app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.BusinessAdministrator'
    requires:
      - name: app-api
  - name: workshop_app-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
