
_schema-version: 3.3.0
ID: airline-app
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  - name: airline-app-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'

    requires:
      - name: airline-app-auth
      - name: airline-app-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv

      - name: airline-app-db

    deployed-after:
      - airline-app-ams-policies-deployer

    properties:
      AMS_DCL_ROOT: ams/dcl


  - name: airline-app-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: airline-app-db


  - name: airline-app
    type: approuter.nodejs
    path: .deploy/app-router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-cert-url}
          forwardAuthToken: true
          forwardAuthCertificates: true
          strictSSL: true

      - name: airline-app-auth

      - name: airline-app-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: approuter

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}


  - name: airline-app-ams-policies-deployer
    type: javascript.nodejs
    path: gen/policies

    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-dcl
          command: npm start
          memory: 512M

    requires:
      - name: airline-app-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: ams-policy-deployer


resources:

  - name: airline-app-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

      config:
        xsappname: airline-app-${org}-${space}
        tenant-mode: dedicated

        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**

        role-collections:
          - name: 'Passenger (airline-app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Passenger'

          - name: 'BookingAgent (airline-app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.BookingAgent'

          - name: 'FlightOperator (airline-app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.FlightOperator'

          - name: 'FinanceManager (airline-app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.FinanceManager'

          - name: 'BusinessAdministrator (airline-app ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.BusinessAdministrator'

    requires:
      - name: app-api


  - name: airline-app-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared


  - name: airline-app-ias
    type: org.cloudfoundry.managed-service

    parameters:
      service: identity
      service-name: airline-app-ias
      service-plan: application

      config:
        display-name: airline-app

        provided-apis:
          - name: airline-app-ias-api
            description: API exposed by the application

        oauth2-configuration:
          token-policy:
            access-token-format: jwt

          redirect-uris:
            - http://localhost:5000/login/callback?authType=ias
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/login/callback

          post-logout-redirect-uris:
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/*/logout.html

        authorization:
          enabled: true

        xsuaa-cross-consumption: true

    requires:
      - name: app-api
